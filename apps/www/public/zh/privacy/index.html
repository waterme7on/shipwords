      <h1>隐私说明</h1>
      <p>这是 shipwords 开源项目官网的自托管副本。这里没有账户、没有表单、没有邮件订阅，不会向你要姓名或邮箱。</p>
      <h2>统计</h2>
      <p>这个副本不加载统计脚本。上游项目站 shipwords.dev 使用 Google Analytics 4 和 Rybbit；代码仍在仓库里，但只在上游域名生效。</p>
      <h2>用 shipwords 搭建的网站</h2>
      <p>用这套代码搭建的每个网站（包括 tinydeskai.io）都由各自的站长运营，各有自己的隐私政策。</p>
